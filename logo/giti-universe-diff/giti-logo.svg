<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Giti universe diff logo</title>
  <desc id="desc">A Git branch and diff floating inside planetary rings on a dark rounded square.</desc>
  <defs>
    <radialGradient id="tile" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset=".72" stop-color="#0c1729"/>
      <stop offset="1" stop-color="#101c30"/>
    </radialGradient>
    <linearGradient id="orbit" x1="150" y1="230" x2="850" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#536c95"/><stop offset=".55" stop-color="#314665"/><stop offset="1" stop-color="#50688f"/>
    </linearGradient>
    <linearGradient id="git" x1="360" y1="255" x2="570" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff442f"/><stop offset=".48" stop-color="#ff6534"/><stop offset="1" stop-color="#ff4932"/>
    </linearGradient>
    <linearGradient id="green" x1="365" y1="705" x2="690" y2="905" gradientUnits="userSpaceOnUse">
