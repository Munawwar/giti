      <circle cx="164" cy="326" r="4.5"/><circle cx="806" cy="727" r="4.5"/>
      <circle cx="286" cy="789" r="4.5"/><circle cx="709" cy="789" r="4.5"/>
      <circle cx="821" cy="197" r="33" opacity=".8"/><circle cx="199" cy="731" r="18" opacity=".72"/>
      <path d="m203 178 6 12 12 6-12 6-6 12-6-12-12-6 12-6zm635 370 5 10 10 5-10 5-5 10-5-10-10-5 10-5z"/>
